<!-- Page: register -->

<div class="page" id="p-register">
<div class="pb"><div class="pb-title">Create an Account</div><div class="pb-sub">Register as a member of Jamiat Ahle Hadees J&K</div></div>
<div class="bgc"><div class="sec" style="max-width:760px;">
  <div class="sh rv"><span class="stag">New Member</span><h2 class="stitle">Register Your <em>Account</em></h2><p class="sdesc">Create a member account to access the full range of digital services offered by Jamiat Ahle Hadees J&K.</p><div class="orn"><div class="ol"></div><div class="od"></div><div class="ol"></div></div></div>
  <div class="ff rv" style="margin-top:8px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="fg" style="margin-bottom:0;"><label class="fl">First Name</label><input type="text" class="fi" placeholder="e.g. Muhammad"></div>
      <div class="fg" style="margin-bottom:0;"><label class="fl">Last Name</label><input type="text" class="fi" placeholder="e.g. Abdullah"></div>
    </div>
    <div class="fg" style="margin-top:16px;"><label class="fl">Email Address</label><input type="email" class="fi" placeholder="your@email.com"></div>
    <div class="fg"><label class="fl">Mobile Number</label><input type="tel" class="fi" placeholder="+91 98765 43210"></div>
    <div class="fg"><label class="fl">District</label><select class="fs"><option value="">Select your district...</option><option>Srinagar</option><option>Baramulla</option><option>Sopore</option><option>Anantnag</option><option>Pulwama</option><option>Shopian</option><option>Kulgam</option><option>Kupwara</option><option>Bandipora</option><option>Ganderbal</option><option>Budgam</option><option>Jammu</option><option>Udhampur</option><option>Other</option></select></div>
    <div class="fg"><label class="fl">Member Type</label><select class="fs"><option>Individual Member</option><option>Institution Representative</option><option>Scholar / Alim</option><option>Imam / Khatib</option></select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="fg" style="margin-bottom:0;"><label class="fl">Password</label><input type="password" class="fi" placeholder="Min. 8 characters"></div>
      <div class="fg" style="margin-bottom:0;"><label class="fl">Confirm Password</label><input type="password" class="fi" placeholder="Repeat password"></div>
    </div>
    <div style="margin-top:20px;margin-bottom:20px;padding:14px 16px;background:rgba(26,92,52,.06);border-radius:var(--r);border-left:3px solid var(--gm);">
      <label style="display:flex;align-items:flex-start;gap:10px;font-family:'Cormorant Garamond',serif;font-size:.97rem;color:var(--inkm);cursor:pointer;line-height:1.6;"><input type="checkbox" style="accent-color:var(--gm);margin-top:3px;flex-shrink:0;"> I confirm that the information provided is accurate and I agree to the terms and conditions of Jamiat Ahle Hadees J&K membership.</label>
    </div>
    <button class="btn btn-p" style="width:100%;text-align:center;padding:14px;">Create Account →</button>
    <p style="text-align:center;font-family:'Cormorant Garamond',serif;font-size:.94rem;color:var(--inkf);margin-top:16px;">Already have an account? <button onclick="go('login')" style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gm);background:none;border:none;cursor:pointer;text-decoration:underline;">Sign In</button></p>
  </div>
</div></div>
</div>
